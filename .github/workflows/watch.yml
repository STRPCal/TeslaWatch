name: Tesla stock watch

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (GitHub may delay runs a little)
  workflow_dispatch:           # adds a "Run workflow" button for testing

permissions:
  contents: write              # lets it save seen_cars.json back to the repo

concurrency:
  group: tesla-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install curl_cffi requests

      - name: Check Tesla inventory
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tesla_stock_watch.py --once

      - name: Save which cars have been seen
        run: |
          git config user.name "tesla-watch-bot"
          git config user.email "tesla-watch-bot@users.noreply.github.com"
          git add seen_cars.json status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update seen cars"
            git pull --rebase
            git push
          fi
